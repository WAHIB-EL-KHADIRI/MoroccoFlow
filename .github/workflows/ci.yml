name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: moroccoflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moroccoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres-test-password@127.0.0.1:5432/moroccoflow_test
      TEST_DATABASE_URL: postgres://postgres:postgres-test-password@127.0.0.1:5432/moroccoflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run check
      # Measurement step: reports coverage for both suites. Reported, not enforced yet, so
      # the first numbers can be read before thresholds are chosen (the frontend thresholds
      # in vite.config.js are checked here; the API has none).
      - name: Coverage report (frontend)
        continue-on-error: true
        run: npm run test:coverage
      - name: Coverage report (API)
        continue-on-error: true
        run: npm run test --workspace @moroccoflow/api -- --coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
